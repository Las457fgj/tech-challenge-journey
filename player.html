
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رحلة التحدي التقني</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 min-height:100vh;
 font-family:Tahoma,Arial,sans-serif;
 color:#25364B;
 background:
 radial-gradient(circle at 10% 15%,#A9C5D677,transparent 30%),
 radial-gradient(circle at 90% 85%,#B8B3D355,transparent 32%),
 linear-gradient(135deg,#E9EEF3,#D3E3E8,#F5F8FA);
 display:flex;
 align-items:center;
 justify-content:center;
 padding:25px;
}
.page{
 width:100%;
 max-width:700px;
 text-align:center;
}
.school{
 font-size:17px;
 color:#425C75;
 font-weight:bold;
 margin-bottom:12px;
}
.team{
 font-size:14px;
 color:#647D96;
 letter-spacing:.5px;
 margin-bottom:35px;
}
.symbol{
 width:75px;
 height:75px;
 border-radius:23px;
 margin:0 auto 22px;
 display:grid;
 place-items:center;
 background:linear-gradient(145deg,#647D96,#A9C5D6);
 color:white;
 font-size:35px;
 box-shadow:0 10px 25px #647D9633;
}
h1{
 font-size:clamp(34px,7vw,53px);
 line-height:1.5;
 margin:0 0 12px;
 color:#25364B;
}
h1 span{color:#647D96}
.description{
 color:#647D96;
 font-size:16px;
 line-height:2;
 margin:0 auto 30px;
}
.card{
 max-width:490px;
 margin:0 auto;
 padding:30px;
 background:#FFFFFFD9;
 border:1px solid white;
 border-radius:24px;
 box-shadow:0 15px 45px #25364B12;
}
.card h2{
 font-size:21px;
 margin:0 0 25px;
}
.field{
 text-align:right;
 margin-bottom:19px;
}
label{
 display:block;
 margin-bottom:9px;
 font-size:14px;
 color:#425C75;
}
input{
 width:100%;
 padding:16px;
 border:1px solid #C5D7E1;
 border-radius:12px;
 background:#F7FAFC;
 font-family:inherit;
 font-size:16px;
 color:#25364B;
 outline:none;
}
input:focus{
 border-color:#647D96;
 box-shadow:0 0 0 3px #A9C5D633;
}
input::placeholder{color:#9AAEBD}
button{
 width:100%;
 padding:17px;
 border:0;
 border-radius:13px;
 background:linear-gradient(100deg,#647D96,#8EACC0);
 color:white;
 font-family:inherit;
 font-size:17px;
 font-weight:bold;
 cursor:pointer;
 transition:.2s;
}
button:hover{transform:translateY(-2px)}
#message{
 color:#647D96;
 font-size:14px;
 line-height:1.8;
 min-height:24px;
 margin:15px 0 0;
}
.note{
 color:#8A9CAD;
 font-size:12px;
 line-height:1.8;
 margin-top:19px;
}
footer{
 margin-top:30px;
 color:#8A9CAD;
 font-size:12px;
}
@media(max-width:480px){
 body{padding:22px 15px}
 .card{padding:25px 20px}
 .school{font-size:15px}
 .description{font-size:14px}
}
</style>
</head>
<body>
<main class="page">

<div class="school">مدرسة سترة الثانوية للبنات</div>
<div class="team">فريق التمكين الرقمي</div>

<div class="symbol">✧</div>

<h1>رحلة التحدي <span>التقني</span></h1>

<p class="description">
رحلة من الإبداع والتفكير والتكنولوجيا
<br>
استعدوا لاكتشاف مهاراتكم وخوض أربعة تحديات نحو المستقبل.
</p>

<section class="card">
<h2>بوابة دخول الفرق</h2>

<form id="joinForm">
<div class="field">
<label for="teamName">اسم الفريق</label>
<input id="teamName" type="text"
placeholder="اكتبوا اسم فريقكم" required>
</div>

<div class="field">
<label for="gameCode">رمز اللعبة</label>
<input id="gameCode" type="text"
placeholder="أدخلوا رمز اللعبة" required>
</div>

<button type="submit">ابدؤوا الرحلة ←</button>
</form>

<p id="message"></p>

<div class="note">
بعد الانضمام، انتظروا إعلان المعلمة لبدء التحدي.
</div>
</section>

<footer>
رحلة التحدي التقني · 2026
</footer>

</main>

<script>
document.getElementById("joinForm").addEventListener("submit",function(e){
 e.preventDefault();

 const team=document.getElementById("teamName").value.trim();
 const code=document.getElementById("gameCode").value.trim();
 const message=document.getElementById("message");

 if(!team||!code){
  message.textContent="يرجى إدخال اسم الفريق ورمز اللعبة.";
  return;
 }

 message.textContent="تم إدخال البيانات! سيتم تفعيل الانضمام بعد ربط اللعبة بقاعدة البيانات.";
});
</script>
</body>
</html>
