
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>رحلة التحدي التقني</title>
</head>
<body>
  <h1>رحلة التحدي التقني</h1>
  <p>رحلة من الإبداع، التفكير، والتكنولوجيا</p>

  <h2>انضموا إلى التحدي</h2>

  <input type="text" id="teamName" placeholder="اسم الفريق">
  <input type="text" id="gameCode" placeholder="رمز اللعبة">

  <button onclick="joinGame()">انضمام</button>

  <p id="message"></p>

  <script>
    function joinGame() {
      const team = document.getElementById("teamName").value.trim();
      const code = document.getElementById("gameCode").value.trim();

      if (!team || !code) {
        document.getElementById("message").textContent =
          "يرجى إدخال اسم الفريق ورمز اللعبة";
        return;
      }

      document.getElementById("message").textContent =
        "تم إدخال البيانات، جاري تجهيز الرحلة...";
    }
  </script>
</body>
</html>
