<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رحلة التحدي التقني</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:#E9EEF3;
  color:#25364B;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.container{
  max-width:650px;
  width:100%;
  text-align:center;
}
.card{
  background:white;
  padding:35px 25px;
  border-radius:22px;
  box-shadow:0 8px 30px #25364B12;
}
h1{font-size:32px;margin-bottom:12px}
p{color:#647D96;line-height:1.9}
.buttons{display:grid;gap:14px;margin-top:28px}
a{
  display:block;
  text-decoration:none;
  padding:16px;
  border-radius:13px;
  font-size:18px;
  font-weight:bold;
}
.player{background:#647D96;color:white}
.admin{background:#D3E3E8;color:#25364B}
.small{font-size:13px;margin-top:25px}
</style>
</head>
<body>
<div class="container">
<div class="card">
<h1>رحلة التحدي التقني</h1>
<p>رحلة من الإبداع والتفكير والتكنولوجيا</p>
<p>أهلًا بكم في عالم التحديات التقنية!<br>اختاروا الصفحة المناسبة للمتابعة.</p>
<div class="buttons">
<a class="player" href="player.html">دخول الفرق المشاركة</a>
<a class="admin" href="admin.html">لوحة تحكم المعلمة</a>
</div>
<p class="small">رحلة التحدي التقني · 2026</p>
</div>
</div>
</body>
</html>
